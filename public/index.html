<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home page</title>
    <link rel="stylesheet" href="/public/css/main.css" />
    <script src="/public/js/app.js" type="module" defer></script>
  </head>
  <body>
    <header class="container">
      <div class="logo-conatiner">
        <img src="/public/images/logo.png" height="35" alt="Url Shortner" />
        <h2>Url Shortner</h2>
      </div>
      <nav>
        <ul>
          <li><a class="navlink" href="/">Urls</a></li>
          <li><a class="navlink" href="/urls/create">create url</a></li>
          <template id="not-loggedin-links">
            <li><a class="navlink" href="/account">My Account</a></li>
          </template>
          <template id="loggedin-links">
            <li><a class="navlink" href="/account/logout">Logout</a></li>
            <li><a class="navlink" href="/account">My Account</a></li>
          </template>
        </ul>
      </nav>
    </header>
    <main class="container"></main>

    <dialog id="alert-modal">
      <h3>Error</h3>
      <ul>
        There was en error loading the page
      </ul>
      <button onclick="app.closeError()">Ok</button>
    </dialog>

    <template id="template-URLs">
      <h1>Urls</h1>
      <ul></ul>
    </template>

    <template id="template-Login">
      <h1>Login</h1>
      <form class="rejester-form" onsubmit="app.login(event)">
        <input type="text" name="login" placeholder="Login" />
        <input type="password" name="password" placeholder="Password" />
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <button type="submit">Login</button>
          <a href="/account/register">Create account</a>
        </div>
      </form>
    </template>

    <template id="template-Register">
      <h1>Create Account</h1>
      <div>
        <form class="rejester-form" onsubmit="app.createAccount(event)">
          <input type="text" name="username" placeholder="Username" />
          <input type="email" name="email" placeholder="Email" />
          <input type="password" name="password" placeholder="Password" />
          <input
            type="password"
            name="confirm-password"
            placeholder="Confirm Password"
          />
          <div>
            <button type="submit">Create</button>
          </div>
        </form>
        <span> Already Have Account, <a href="/account/login">Login</a> </span>
      </div>
    </template>

    <template id="template-account">
      <h1>Account</h1>
    </template>

    <template id="template-createURL">
      <form>
        <div>
          <label for="long_url">Url:</label>
          <input name="long_url" id="long_url" />
        </div>

        <button type="submit">Create</button>
      </form>
    </template>
  </body>
</html>
